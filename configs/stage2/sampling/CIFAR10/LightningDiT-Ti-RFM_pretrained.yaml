# Sampling with the released weights (download into pretrained_models/, see README).
# Experiment 13: LightningDiT-Ti/1 + RFM (RJF without the Jacobi weight). FID 9.41 at R = 18 (11.80 at R = 13.66).
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'CifarDinoViT'
    encoder_config_path: 'unused'
    encoder_input_size: 32
    encoder_params:
      ckpt_path: 'pretrained_models/encoders/encoder_dinov2_vit_tiny4.pt'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    decoder_patch_size: 4
    pretrained_decoder_path: 'pretrained_models/stage1/decoder_vitxl_gan.pt'
    noise_tau: 0.
    reshape_to_2d: true
    normalization_stat_path: 'pretrained_models/stats/normalization_stats.pt'

stage_2:
  target: stage2.models.lightningDiT.LightningDiT
  params:
    input_size: 8
    patch_size: 1
    in_channels: 192
    hidden_size: 192
    depth: 12
    num_heads: 3
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 10
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
  ckpt: 'pretrained_models/stage2/rfm_lightningdit_ti_ema.pt'

transport:
  params:
    path_type: 'Spherical'
    sphere_radius: 18   # output per-token norm; 13.66 is the mean norm of the normalized latent
    jacobi_weight: false   # RFM: no sinc^2 weight
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0   # no CFG; CFG only makes FID worse here (experiment 05)
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [192, 8, 8] # [C, H, W]
  num_classes: 10
  time_dist_shift_dim: 12288 # 8*8*192 -> shift sqrt(12288/4096) ~= 1.73
  time_dist_shift_base: 4096
